services:
  patients-db:
    image: postgres:16-alpine
    container_name: patients-db
    environment:
      POSTGRES_DB: patients
      POSTGRES_USER: patients_user
      POSTGRES_PASSWORD: patients_pass
    ports:
      - "5433:5432"
    volumes:
      - patients-db-data:/var/lib/postgresql/data

  users-db:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users_user
      POSTGRES_PASSWORD: users_pass
    ports:
      - "5434:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data

  triage-db:
    image: postgres:16-alpine
    container_name: triage-db
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage_user
      POSTGRES_PASSWORD: triage_pass
    ports:
      - "5435:5432"
    volumes:
      - triage-db-data:/var/lib/postgresql/data

  ehr-db:
    image: postgres:16-alpine
    container_name: ehr-db
    environment:
      POSTGRES_DB: ehr
      POSTGRES_USER: ehr_user
      POSTGRES_PASSWORD: ehr_pass
    ports:
      - "5436:5432"
    volumes:
      - ehr-db-data:/var/lib/postgresql/data

  patients:
    build:
      context: .
      dockerfile: apps/patients/Dockerfile
    container_name: patients
    ports:
      - "3001:3000"
    environment:
      PATIENTS_DB_URL: postgresql://patients_user:patients_pass@patients-db:5432/patients
      PORT: 3000
      RABBITMQ_URL: 'amqp://admin:admin@rabbitmq:5672'
      RABBITMQ_QUEUE_PATIENTS_EVENTS: 'patients.events'
      RABBITMQ_EXCHANGE_PATIENTS: 'patients.exchange'
    depends_on:
      - patients-db
      - rabbitmq

  users:
    build:
      context: .
      dockerfile: apps/users/Dockerfile
    container_name: users
    ports:
      - "3002:3000"
    environment:
      USER_DB_URL: "postgresql://users_user:users_pass@users-db:5432/users"
      JWT_SECRET: "Users_Secret"
      PORT: 3000
    depends_on:
      - users-db

  triage:
    build:
      context: .
      dockerfile: apps/triage/Dockerfile
    container_name: triage
    ports:
      - "3003:3000"
    environment:
      TRIAGE_DB_URL: "postgresql://triage_user:triage_pass@triage-db:5432/triage"
      PATIENTS_SERVICE_URL: 'http://patients:3000'
      USERS_SERVICE_URL: 'http://users:3000'
      PORT: 3000
      RABBITMQ_URL: 'amqp://admin:admin@rabbitmq:5672'
      RABBITMQ_QUEUE_TRIAGE_EVENTS: 'triage.events'
      RABBITMQ_EXCHANGE_TRIAGE: 'triage.exchange'
    depends_on:
      - triage-db
      - rabbitmq

  ehr:
    build:
      context: .
      dockerfile: apps/ehr/Dockerfile
    container_name: ehr
    ports:
      - "3004:3000"
    environment:
      EHR_DB_URL: "postgresql://ehr_user:ehr_pass@ehr-db:5432/ehr"
      PORT: 3000
      RABBITMQ_URL: 'amqp://admin:admin@rabbitmq:5672'
      RABBITMQ_QUEUE_EHR_EVENTS: 'ehr.events'
      RABBITMQ_EXCHANGE_EHR: 'ehr.exchange'
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      HUGGINGFACE_MODEL: 'NousResearch/Nous-Hermes-2-Medical'
    depends_on:
      - ehr-db
      - rabbitmq

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3005:3000"
    environment:
      ROLES_URL: 'http://roles:3000'
      PATIENTS_URL: 'http://patients:3000'
      USERS_URL: 'http://users:3000'
      TRIAGE_URL: 'http://triage:3000'
      EHR_URL: 'http://ehr:3000'
      RABBITMQ_URL: 'amqp://admin:admin@rabbitmq:5672'
      RABBITMQ_QUEUE_TRIAGE_EVENTS: 'triage.events'
      RABBITMQ_QUEUE_PATIENTS_EVENTS: 'patients.events'
      RABBITMQ_QUEUE_EHR_EVENTS: 'ehr.events'
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  patients-db-data:
  users-db-data:
  triage-db-data:
  ehr-db-data:
  rabbitmq-data:
